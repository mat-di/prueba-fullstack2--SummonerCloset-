<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummonerCloset</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="estilos/estilo-sesion.css">
</head>
<body>
    <header>
        <h1>SummonerCloset</h1>
        <nav>
            <a href="index.html">inicio</a>
            <a href="#footer">nosotros</a>
            <a href="#footer">contacto</a>
        </nav>
    <a href="iniciar_sesion.html">iniciar sesión</a>
    </header>
    <main>
        <form class="box">
            <div class="field">
                <label class="label">Usuario</label>
                <div class="control">
                <input class="input" type="text" id="user" placeholder="Ingrese su usuario" />
                </div>
            </div>

            <div class="field">
                <label class="label">Email</label>
                <div class="control">
                <input class="input" type="email" id="email" placeholder="Ingrese su correo electrónico" />
                </div>
            </div>

            <div class="field">
                <label class="label">Confirmar Email</label>
                <div class="control">
                <input class="input" type="email" id="confirmEmail" placeholder="Confirme su correo electrónico" onkeydown="validarCorreo(event)"/>
                </div>
            </div>

            <div class="field">
                <label class="label">Contraseña</label>
                <div class="control">
                <input class="input" type="password" id="password" placeholder="*****************" />
                </div>
            </div>

            <button class="button is-primary" type="button" onclick=window.location.href="iniciar_sesion.html">Crear cuenta</button>
        </form>
    </main>
    <footer id="footer">
        <div class="footer-paginas">
            <h3>NUESTRAS REDES</h3>
            <a href="https://www.facebook.com/RiotGames">Facebook</a>
            <a href="https://www.instagram.com/riotgames">Instagram</a>
        </div>
        <div class="derechos">
            <p>Todos los derechos reservados a tilinazo67</p>
        </div>
        <div class="riot">
            <h3>PÁGINA OFICIAL</h3>
            <a href="https://www.riotgames.com" class="riot-link">Página oficial</a>
        </div>
    </footer> 
</body>
</html>
