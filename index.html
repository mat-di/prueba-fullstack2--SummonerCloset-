<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummonerCloset</title>
    <link rel="stylesheet" href="estilos/estilo.css">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <header>
        <h1 id="titulo">
            SummonerCloset
        </h1>
    </header>
    <main>
        <section class="buscador">
            <div class="buscador-superior">
                <h2>Buscador</h2>
                <div class="roles">
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Top_icon.png" alt="Icono Top">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Jungle_icon.png" alt="Icono Jungle">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Middle_icon.png" alt="Icono Middle">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Bottom_icon.png" alt="Icono Bottom">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Support_icon.png" alt="Icono Support">
                    </button>
                    <button class="button is-white" type="reset">
                        <img src="imagenes/remover_filtro.png" alt="Icono limpiar filtro">
                    </button>
                </div>
            </div>
            <div class="buscador-form">
                <input
                    class="input is-primary"
                    type="text"
                    maxlength="30"
                    placeholder="Buscar un campeón"
                />
                <button class="button is-success" type="submit">
                    <i class="fas fa-search">🔎</i>
                </button>
            </div>
        </section>

        <section class="campeones">
            <h2>Campeones</h2>
            <div class="campeones-tarjetas">
                <div class="campeon-tarjeta" id="aatrox">
                    <img src="imagenes/campeones/Aatrox.webp" alt="Aatrox">
                    <p>Aatrox</p>
                </div>
                <div class="campeon-tarjeta" id="ahri">
                    <img src="imagenes/campeones/Ahri.webp" alt="Ahri">
                    <p>Ahri</p>
                </div>
                <div class="campeon-tarjeta" id="akali">
                    <img src="imagenes/campeones/Akali.webp" alt="Akali">
                    <p>Akali</p>
                </div>
                <div class="campeon-tarjeta" id="akshan">
                    <img src="imagenes/campeones/Akshan.webp" alt="Akshan">
                    <p>Akshan</p>
                </div>
                <div class="campeon-tarjeta" id="alistar">
                    <img src="imagenes/campeones/Alistar.webp" alt="Alistar">
                    <p>Alistar</p>
                </div>
                <div class="campeon-tarjeta" id="ambessa">
                    <img src="imagenes/campeones/Ambessa.webp" alt="Ambessa">
                    <p>Ambessa</p>
                </div>
                <div class="campeon-tarjeta" id="amumu">
                    <img src="imagenes/campeones/Amumu.webp" alt="Amumu">
                    <p>Amumu</p>
                </div>
                <div class="campeon-tarjeta" id="anivia">
                    <img src="imagenes/campeones/Anivia.webp" alt="Anivia">
                    <p>Anivia</p>
                </div>
                <div class="campeon-tarjeta" id="annie">
                    <img src="imagenes/campeones/Annie.webp" alt="Annie">
                    <p>Annie</p>
                </div>
                <div class="campeon-tarjeta" id="aphelios">
                    <img src="imagenes/campeones/Aphelios.webp" alt="Aphelios">
                    <p>Aphelios</p>
                </div>
                <div class="campeon-tarjeta" id="ashe">
                    <img src="imagenes/campeones/Ashe.webp" alt="Ashe">
                    <p>Ashe</p>
                </div>
                <div class="campeon-tarjeta" id="aurelion">
                    <img src="imagenes/campeones/Aurelion_Sol.webp" alt="Aurelion">
                    <p>Aurelion</p>
                </div>
                <div class="campeon-tarjeta" id="aurora">
                    <img src="imagenes/campeones/Aurora.webp" alt="Aurora">
                    <p>Aurora</p>
                </div>
                <div class="campeon-tarjeta" id="aazir">
                    <img src="imagenes/campeones/Azir.webp" alt="Azir">
                    <p>Azir</p>
                </div>
                <div class="campeon-tarjeta" id="bard">
                    <img src="imagenes/campeones/Bard.webp" alt="Bard">
                    <p>Bard</p>
                </div>
                <div class="campeon-tarjeta" id="blitzcrank">
                    <img src="imagenes/campeones/Blitzcrank.webp" alt="Blitzcrank">
                    <p>Blitzcrank</p>
                </div>
                <div class="campeon-tarjeta" id="brand">
                    <img src="imagenes/campeones/Brand.webp" alt="Brand">
                    <p>Brand</p>
                </div>
                <div class="campeon-tarjeta" id="braum">
                    <img src="imagenes/campeones/Braum.webp" alt="Braum">
                    <p>Braum</p>
                </div>
                <div class="campeon-tarjeta" id="caitlyn">
                    <img src="imagenes/campeones/Caitlyn.webp" alt="Caitlyn">
                    <p>Caitlyn</p>
                </div>
                <div class="campeon-tarjeta" id="camille">
                    <img src="imagenes/campeones/Camille.webp" alt="Camille">
                    <p>Camille</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        Todos los derechos reservados a tilinazo67
    </footer>
</body>
<script src="scripts/script.js">
</script>
</html>
