<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummonerCloset</title>
    <link rel="stylesheet" href="estilos/estilo.css">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <header>
        <h1 id="titulo">
            SummonerCloset
        </h1>
    </header>
    <main>
        <section class="buscador">
            <div class="buscador-superior">
                <h2>Buscador</h2>
                <div class="roles">
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Top_icon.png" alt="Icono Top">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Jungle_icon.png" alt="Icono Jungle">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Middle_icon.png" alt="Icono Middle">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Bottom_icon.png" alt="Icono Bottom">
                    </button>
                    <button class="button is-black" type="submit">
                        <img src="imagenes/Support_icon.png" alt="Icono Support">
                    </button>
                    <button class="button is-white" type="reset">
                        <img src="imagenes/remover_filtro.png" alt="Icono limpiar filtro">
                    </button>
                </div>
            </div>
            <div class="buscador-form">
                <input
                    class="input is-primary"
                    type="text"
                    maxlength="30"
                    placeholder="Buscar un campeón"
                />
                <button class="button is-success" type="submit">
                    <i class="fas fa-search">🔎</i>
                </button>
            </div>
        </section>

        <section class="campeones">
            <h2>Campeones</h2>
            <div class="campeones-tarjetas">
                <article class="campeon-tarjeta" id="aatrox" role="button" aria-label="Ver skins de Aatrox">
                    <img src="imagenes/campeones/Aatrox.webp" alt="Aatrox">
                    <p>Aatrox</p>
                </article>

                <article class="campeon-tarjeta" id="ahri" role="button" aria-label="Ver skins de Ahri">
                    <img src="imagenes/campeones/Ahri.webp" alt="Ahri">
                    <p>Ahri</p>
                </article>

                <article class="campeon-tarjeta" id="akali" role="button" aria-label="Ver skins de Akali">
                    <img src="imagenes/campeones/Akali.webp" alt="Akali">
                    <p>Akali</p>
                </article>

                <article class="campeon-tarjeta" id="akshan" role="button" aria-label="Ver skins de Akshan">
                    <img src="imagenes/campeones/Akshan.webp" alt="Akshan">
                    <p>Akshan</p>
                </article>

                <article class="campeon-tarjeta" id="alistar" role="button" aria-label="Ver skins de Alistar">

                <article class="campeon-tarjeta" id="amumu" role="button" aria-label="Ver skins de Amumu">
                    <img src="imagenes/campeones/Amumu.webp" alt="Amumu">
                    <p>Amumu</p>
                </article>

                <article class="campeon-tarjeta" id="anivia" role="button" aria-label="Ver skins de Anivia">

                    <p>Anivia</p>
                </article>

                <article class="campeon-tarjeta" id="annie" role="button" aria-label="Ver skins de Annie">
                    <img src="imagenes/campeones/Annie.webp" alt="Annie">
                    <p>Annie</p>

                <article class="campeon-tarjeta" id="aphelios" role="button" aria-label="Ver skins de Aphelios">

    <footer>
        Todos los derechos reservados a tilinazo67

</body>
<script src="scripts/script.js">
